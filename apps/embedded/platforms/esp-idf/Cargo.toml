[package]
name = "enigma-embedded-esp-idf"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
resolver = "2"

[[bin]]
name = "enigma-embedded-esp-idf"
harness = false

# This platform package is isolated from Enigma's host workspace. Its target
# and standard library are supplied by the Espressif Xtensa toolchain.
[workspace]

[features]
default = ["board-lichuang-esp32s3"]
board-lichuang-esp32s3 = []

[profile.dev]
debug = true
opt-level = "z"

[profile.release]
lto = false
opt-level = "z"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[dependencies]
embedded-graphics = "0.7.1"
enigma-embedded-bridge-protocol = { path = "../../bridge-protocol" }
enigma-embedded-core = { path = "../../core" }
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "63a341d7f624b5c1f2540e4cecb269151a2caf52", default-features = false, features = ["core_device_proxy", "dvt", "location_simulation", "remote_pairing", "rsd", "rustcrypto", "tcp", "tunnel_tcp_stack"] }
log = "0.4"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }

[build-dependencies]
embuild = "0.33"
