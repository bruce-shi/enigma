[package]
name = "enigma-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "enigma-desktop"

[lib]
name = "enigma_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
m0-probe = []

[[bin]]
name = "enigma-desktop"
path = "src/main.rs"

[[bin]]
name = "m0-probe"
path = "src/bin/m0_probe.rs"
required-features = ["m0-probe"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
async-trait = "=0.1.92"
base64 = "=0.22.1"
chacha20poly1305 = "=0.10.1"
clap = { version = "=4.6.6", features = ["derive"] }
enigma-embedded-bridge-protocol = { path = "../../embedded/bridge-protocol" }
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "63a341d7f624b5c1f2540e4cecb269151a2caf52", default-features = false, features = [
  "ring",
  "core_device_proxy",
  "dvt",
  "location_simulation",
  "mdns",
  "mobile_image_mounter",
  "pair",
  "rsd",
  "tunnel_tcp_stack",
  "usbmuxd",
  "xpc",
] }
rand = "=0.9.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
serialport = { version = "=4.9.0", default-features = false }
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "=2.10.1"
thiserror = "=2.0.16"
time = { version = "=0.3.55", features = ["formatting", "serde"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.24.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.22.0"
